<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creative Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Heebo:wght@500;700&display=swap">
<style>
/* Layout: a single pixel "desktop" — title banner, search prompt, a grid of app windows. One committed look (bright green CRT), no dark variant. */
:root{
  --lime:#3dff2e; --lime-2:#2be01c; --ink:#062b00; --black:#0a0f08; --paper:#eaffe2; --hot:#ff2bd6;
  --f-pixel:"Press Start 2P",ui-monospace,monospace;
  --f-term:"VT323",ui-monospace,monospace;
  --f-he:"Heebo",system-ui,sans-serif;
  --px:4px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--lime)}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-term),var(--f-he);font-size:22px;line-height:1.15;
  background-color:var(--lime);
  /* 2px ordered dither, the way 90s desktops faked a second shade */
  background-image:
    linear-gradient(45deg,var(--lime-2) 25%,transparent 25%,transparent 75%,var(--lime-2) 75%),
    linear-gradient(45deg,var(--lime-2) 25%,transparent 25%,transparent 75%,var(--lime-2) 75%);
  background-size:4px 4px;background-position:0 0,2px 2px;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  image-rendering:pixelated;
}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* banner */
.banner{background:var(--black);color:var(--lime);padding:22px 20px 18px;box-shadow:8px 8px 0 var(--ink);border:var(--px) solid var(--black);position:relative;direction:ltr}
.banner h1{font-family:var(--f-pixel);font-weight:400;font-size:clamp(20px,5.2vw,40px);line-height:1.25;margin:0;letter-spacing:.02em;text-shadow:4px 4px 0 #0f5a00}
.banner h1 .cur{display:inline-block;width:.6em;height:1em;background:var(--lime);vertical-align:-.12em;margin-left:.15em;animation:blink 1s steps(1) infinite}
.banner p{margin:12px 0 0;font-size:22px;color:#a6ff9c;direction:rtl;text-align:left;font-family:var(--f-he);font-weight:500;font-size:15px;letter-spacing:.01em}
.banner .meta{position:absolute;top:10px;right:12px;font-family:var(--f-pixel);font-size:9px;color:#5fd352}
@keyframes blink{50%{opacity:0}}

/* prompt */
.prompt{display:flex;align-items:center;gap:10px;background:var(--paper);border:var(--px) solid var(--black);box-shadow:6px 6px 0 var(--ink);padding:8px 12px;direction:ltr}
.prompt label{font-family:var(--f-pixel);font-size:12px;color:var(--ink);white-space:nowrap}
.prompt input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:26px;color:var(--black);outline:none;direction:auto}
.prompt input::placeholder{color:#5c8f52}
.prompt:focus-within{outline:var(--px) dashed var(--hot);outline-offset:4px}
.count{font-family:var(--f-pixel);font-size:10px;white-space:nowrap}

/* app grid */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.win{display:flex;flex-direction:column;height:100%;background:var(--paper);border:var(--px) solid var(--black);box-shadow:8px 8px 0 var(--ink);color:inherit;text-decoration:none;transition:transform .08s steps(2),box-shadow .08s steps(2)}
.win:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--ink)}
.win:active{transform:translate(4px,4px);box-shadow:4px 4px 0 var(--ink)}
.win:focus-visible{outline:var(--px) dashed var(--hot);outline-offset:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--black);color:var(--lime);padding:6px 8px;direction:ltr}
.bar span{font-family:var(--f-pixel);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{display:flex;gap:4px;font-style:normal}
.bar i b{width:12px;height:12px;background:var(--lime);box-shadow:inset -2px -2px 0 #1a8a10}
.screen{background:var(--black);margin:10px 10px 0;aspect-ratio:16/9;max-width:100%;display:flex;align-items:center;justify-content:center;border:2px solid #1b3b14;overflow:hidden}
.screen svg{width:58%;height:auto;shape-rendering:crispEdges}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font-family:var(--f-he);font-weight:700;font-size:20px;color:var(--black)}
.body p{margin:0;font-family:var(--f-he);font-weight:500;font-size:14px;line-height:1.5;color:#1d4a14}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px;direction:ltr;justify-content:flex-end}
.tag{font-family:var(--f-pixel);font-size:8px;padding:5px 6px;background:var(--lime);border:2px solid var(--black)}
.tag.new{background:var(--hot);color:#fff}
.key{font-family:var(--f-pixel);font-size:9px;color:#5fd352}
.empty{font-family:var(--f-pixel);font-size:12px;background:var(--paper);border:var(--px) solid var(--black);padding:20px;box-shadow:6px 6px 0 var(--ink);direction:ltr}
footer{font-family:var(--f-pixel);font-size:9px;color:var(--ink);direction:ltr;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){.banner h1 .cur{animation:none}.win{transition:none}}
@media (max-width:420px){body{font-size:20px}.grid{gap:20px}}
</style>
</head>
<body>
<main>
  <header class="banner">
    <span class="meta">EPHEMERAL.LAB v1.0</span>
    <h1>CREATIVE_CODING<span class="cur" aria-hidden="true"></span></h1>
    <p>סקיצות אינטראקטיביות שרצות בדפדפן. בוחרים אחת ונכנסים.</p>
  </header>

  <div class="prompt">
    <label for="q">C:\&gt;</label>
    <input id="q" type="search" placeholder="search / חיפוש..." autocomplete="off">
    <span class="count" id="count"></span>
  </div>

  <ul class="grid" id="grid"></ul>

  <footer><span>PRESS 1–9 TO LAUNCH</span><span id="clock"></span></footer>
</main>

<script>
// Add a new app: one entry here, folder with index.html next to this page.
const APPS=[
  {path:'game-of-life-3d/',file:'LIFE3D.EXE',title:'Life³ — משחק החיים בתלת־ממד',
   desc:'שישה סוגי גריד, מצבי דעיכה וצבע לפי יצור. נגיעה מוסיפה יצור, שתי אצבעות לסיבוב וזום.',
   tags:['3D','THREE.JS','CELLULAR'],icon:'cube',added:'2026-10-16'},
  {path:'game-of-life-2d/',file:'LIFE2D.EXE',title:'גריד החיים',
   desc:'משחק החיים של קונווי בדו־ממד. נגיעה מוסיפה גלשנים, חלליות, פולסרים ותותח גוספר.',
   tags:['2D','CANVAS','CELLULAR'],icon:'glider',added:'2026-10-16'},
  {path:'image-slicer/',file:'SLICER.EXE',title:'סטריפים',
   desc:'חיתוך תמונה לסטריפים או טבעות, גרירה של כל רצועה, אנימציית גלים ושמירת התוצאה.',
   tags:['IMAGE','CANVAS'],icon:'strips',added:'2026-10-16'},
];

// 8-bit icons on a 16×9 pixel screen
const ICONS={
  glider:'<rect x="7" y="2" width="1" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="6" y="4" width="3" height="1"/><rect x="2" y="6" width="1" height="1" opacity=".35"/><rect x="12" y="1" width="1" height="1" opacity=".35"/><rect x="11" y="6" width="2" height="1" opacity=".35"/>',
  strips:'<rect x="2" y="1" width="2" height="6"/><rect x="5" y="2" width="2" height="6"/><rect x="8" y="0" width="2" height="6"/><rect x="11" y="3" width="2" height="6"/>'
};
function iconSVG(k){
  if(k==='cube')return '<svg viewBox="0 0 16 9" fill="#3dff2e" aria-hidden="true"><rect x="6" y="1" width="6" height="1" opacity=".6"/><rect x="5" y="2" width="6" height="1" opacity=".6"/><rect x="12" y="1" width="1" height="6" opacity=".35"/><rect x="11" y="2" width="1" height="6" opacity=".35"/><rect x="4" y="3" width="7" height="5"/><rect x="5" y="4" width="2" height="1" fill="#0a0f08"/><rect x="8" y="5" width="2" height="2" fill="#0a0f08"/></svg>';
  if(k==='glider')return '<svg viewBox="0 0 12 7" fill="#3dff2e" aria-hidden="true"><rect x="6" y="1" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="5" y="3" width="3" height="1"/><rect x="2" y="5" width="1" height="1" opacity=".3"/><rect x="3" y="4" width="1" height="1" opacity=".3"/><rect x="9" y="5" width="1" height="1" opacity=".3"/></svg>';
  return '<svg viewBox="0 0 16 9" fill="#3dff2e" aria-hidden="true">'+ICONS[k]+'</svg>';
}

const grid=document.getElementById('grid'),q=document.getElementById('q'),count=document.getElementById('count');
const isNew=d=>(Date.now()-new Date(d))<14*864e5;
function render(){
  const term=q.value.trim().toLowerCase();
  const list=APPS.filter(a=>!term||(a.title+a.desc+a.file+a.tags.join(' ')).toLowerCase().includes(term));
  grid.innerHTML=list.length?'':'<li class="empty">FILE NOT FOUND_</li>';
  list.forEach((a,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<a class="win" href="${a.path}">
      <div class="bar"><span>${a.file}</span><i><span class="key">[${i+1}]</span><b></b><b></b></i></div>
      <div class="screen">${iconSVG(a.icon)}</div>
      <div class="body"><h2>${a.title}</h2><p>${a.desc}</p>
      <div class="tags">${isNew(a.added)?'<span class="tag new">NEW!</span>':''}${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></a>`;
    grid.appendChild(li);
  });
  count.textContent=`${list.length} FILE(S)`;
}
q.addEventListener('input',render);
addEventListener('keydown',e=>{
  if(e.target===q){if(e.key==='Enter'){const f=grid.querySelector('a');if(f)location.href=f.href;}return;}
  const n=+e.key;if(n>=1&&n<=9){const a=grid.querySelectorAll('a')[n-1];if(a)location.href=a.href;}
  if(e.key==='/'){e.preventDefault();q.focus();}
});
const clock=document.getElementById('clock');
const tick=()=>{const d=new Date();clock.textContent=d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};
tick();setInterval(tick,30000);
render();
</script>
</body>
</html>
