<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Strips</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: full-screen image; four edge drawers (top file, right cut, bottom motion, left background), each with a tab handle */
:root{
  --bg:#ecebe8; --glass:rgba(247,246,243,.93); --fg:#1d1c1a; --muted:#6f6c66; --line:#d5d2cc; --accent:#2b4fd8; --stage:#d9d7d2; --chip:#ffffff;
  --f-body:"Heebo",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --glass:rgba(29,28,27,.92); --fg:#ebe9e4; --muted:#9a968e; --line:#3a3834; --accent:#7d97ff; --stage:#0d0d0c; --chip:#262523; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413; --glass:rgba(29,28,27,.92); --fg:#ebe9e4; --muted:#9a968e; --line:#3a3834; --accent:#7d97ff; --stage:#0d0d0c; --chip:#262523; color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--stage);color:var(--fg);font-family:var(--f-body);font-size:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;background:var(--stage)}
canvas#view{display:block;cursor:grab;touch-action:none}
canvas#view.picking{cursor:crosshair}
.hint{position:fixed;bottom:calc(36px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;transition:opacity .6s}

/* drawers */
.drawer{position:fixed;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .25s ease;display:flex;flex-direction:column;gap:8px}
.drawer.r{top:0;bottom:0;right:0;width:224px;transform:translateX(100%);border-left:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) 10px;overflow-y:visible}
.drawer.l{top:0;bottom:0;left:0;width:150px;transform:translateX(-100%);border-right:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.drawer.t{top:0;left:0;right:0;transform:translateY(-100%);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));flex-direction:row;flex-wrap:wrap;justify-content:center}
.drawer.b{bottom:0;left:0;right:0;transform:translateY(100%);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.drawer.open{transform:none}
.drawer .scroll{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.handle{position:absolute;background:var(--glass);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:11px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.r .handle{right:100%;top:50%;transform:translateY(-50%);width:22px;height:72px;border-right:0;border-radius:8px 0 0 8px;writing-mode:vertical-rl}
.l .handle{left:100%;top:50%;transform:translateY(-50%);width:22px;height:62px;border-left:0;border-radius:0 8px 8px 0;writing-mode:vertical-rl}
.t .handle{top:100%;left:50%;transform:translateX(-50%);height:22px;width:72px;border-top:0;border-radius:0 0 8px 8px}
.b .handle{bottom:100%;left:50%;transform:translateX(-50%);height:22px;width:80px;border-bottom:0;border-radius:8px 8px 0 0}
.handle:hover{color:var(--accent)}

h2{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 0;font-weight:500}
.sep{border-top:1px solid var(--line);margin:2px 0}
.row{display:grid;grid-template-columns:54px 1fr 32px;align-items:center;gap:6px}
.row label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=range]{width:100%;min-width:0;margin:0;accent-color:var(--accent)}
.val{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.btns{display:flex;flex-wrap:wrap;gap:4px}
button,.file{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:5px;cursor:pointer;line-height:1.3}
button:hover,.file:hover{border-color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.file input{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{padding:4px 2px}
.seg .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-inline-start:5px;vertical-align:middle}
.seg .live .dot{background:#2fa36b}
.chk{display:flex;align-items:center;justify-content:space-between;gap:6px}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.group{display:flex;flex-direction:column;gap:6px}
.group[hidden]{display:none}
.angles{display:flex;gap:3px}
.angles button{flex:1;padding:3px 0;font-family:var(--f-mono);font-size:10px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sw{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{width:100%;height:26px;border:1px solid var(--line);border-radius:5px;background:none;padding:1px}
select{font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:5px;background:var(--chip);color:var(--fg)}
.animGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px;max-width:900px;margin:0 auto;width:100%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;z-index:20}
.overlay img{max-width:92%;max-height:80%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.overlay p{color:#eee;font-size:12px;margin:0;text-align:center}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

<div class="stage" id="stage"><canvas id="view"></canvas></div>
<div class="hint" id="hint">Drag to shift strips · long-press sends a wave</div>

<!-- top: file -->
<div class="drawer t" id="dT">
  <button class="handle" data-d="dT">Image</button>
  <label class="file">Replace image<input type="file" id="file" accept="image/*"></label>
  <button class="primary" id="export">Save result</button>
  <button id="resetAll">Reset</button>
</div>

<!-- right: cut -->
<div class="drawer r" id="dR">
  <button class="handle" data-d="dR">Cut</button>
  <div class="scroll">
    <div class="seg">
      <button id="tab0" aria-pressed="true">Cut 1<span class="dot"></span></button>
      <button id="tab1" aria-pressed="false">Cut 2<span class="dot"></span></button>
    </div>
    <label class="chk" id="onWrap">Active<input type="checkbox" id="on"></label>
    <div class="seg">
      <button id="typeStrips" aria-pressed="true">Strips</button>
      <button id="typeRings" aria-pressed="false">Rings</button>
    </div>
    <div class="group" id="gStrips">
      <div class="row"><label for="angle">Angle</label><input type="range" id="angle" min="-90" max="90" step="1"><span class="val" id="angleV"></span></div>
      <div class="angles">
        <button data-a="0">0°</button><button data-a="45">45°</button><button data-a="90">90°</button><button data-a="-45">-45°</button><button data-a="-30">-30°</button>
      </div>
    </div>
    <div class="group" id="gRings" hidden>
      <div class="row"><label for="cx">Center ←→</label><input type="range" id="cx" min="0" max="1" step="0.005"><span class="val" id="cxV"></span></div>
      <div class="row"><label for="cy">Center ↑↓</label><input type="range" id="cy" min="0" max="1" step="0.005"><span class="val" id="cyV"></span></div>
      <button id="pickCenter" aria-pressed="false">Tap to set center</button>
    </div>
    <div class="row"><label for="cols">Count</label><input type="range" id="cols" min="2" max="120" step="1"><span class="val" id="colsV"></span></div>
    <div class="row"><label for="gap">Gap</label><input type="range" id="gap" min="0" max="20" step="0.5"><span class="val" id="gapV"></span></div>
    <div class="btns">
      <button id="random">Shuffle</button>
      <button id="smooth">Smooth</button>
      <button id="straight">Straighten</button>
    </div>
    <div class="sep"></div>
    <h2>Drag</h2>
    <div class="row"><label for="radius">Radius</label><input type="range" id="radius" min="0" max="20" step="0.5"><span class="val" id="radiusV"></span></div>
    <div class="row"><label for="sens">Sensitivity</label><input type="range" id="sens" min="0.1" max="1.5" step="0.05"><span class="val" id="sensV"></span></div>
  </div>
</div>

<!-- left: background -->
<div class="drawer l" id="dL">
  <button class="handle" data-d="dL">Background</button>
  <h2>Background color</h2>
  <div class="swatches">
    <button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="White"></button>
    <button class="sw" data-c="#000000" style="background:#000000" aria-label="Black"></button>
    <button class="sw" data-c="#c9c4ba" style="background:#c9c4ba" aria-label="Warm grey"></button>
    <button class="sw" data-c="#6e7378" style="background:#6e7378" aria-label="Blue grey"></button>
    <button class="sw" data-c="#b23a2a" style="background:#b23a2a" aria-label="Red"></button>
    <button class="sw" data-c="#1f3a5f" style="background:#1f3a5f" aria-label="Blue"></button>
  </div>
  <input type="color" id="bgc" value="#ffffff" aria-label="Custom color">
  <div class="sep"></div>
  <label class="chk">Infinite background<input type="checkbox" id="wrap"></label>
</div>

<!-- bottom: animation -->
<div class="drawer b" id="dB">
  <button class="handle" data-d="dB">Animation</button>
  <div class="animGrid">
    <div class="btns"><button id="play" aria-pressed="false">Play</button>
      <select id="mode" aria-label="Motion type">
        <option value="wave">Wave</option>
        <option value="flow">Flow</option>
        <option value="ripple">Ripple</option>
        <option value="drift">Drift</option>
        <option value="none">None</option>
      </select></div>
    <div class="row"><label for="amp">Strength</label><input type="range" id="amp" min="0" max="0.5" step="0.005"><span class="val" id="ampV"></span></div>
    <div class="row"><label for="wl">Wavelength</label><input type="range" id="wl" min="2" max="80" step="0.5"><span class="val" id="wlV"></span></div>
    <div class="row"><label for="speed">Speed</label><input type="range" id="speed" min="0.05" max="3" step="0.05"><span class="val" id="speedV"></span></div>
  </div>
</div>

<div class="overlay" id="ov" hidden>
  <img id="ovImg" alt="Result">
  <p>Long-press (phone) or right-click → save image</p>
  <button id="ovClose">Close</button>
</div>

<script>
const $=id=>document.getElementById(id);
const view=$('view'), ctx=view.getContext('2d'), stage=$('stage');
let img=null, t=0, last=0, cur=0, picking=false, raf=0;
const impulses=[];
const GDEF={radius:3,sens:.5,speed:.6,bg:'#ffffff',wrap:true,play:false};
const G=Object.assign({},GDEF);
const mkLayer=(o)=>Object.assign({on:true,type:'strips',cx:.5,cy:.5,angle:0,cols:24,gap:0,amp:.08,wl:14,mode:'wave'},o);
let layers;
function defaults(){
  layers=[mkLayer({}), mkLayer({on:false,angle:90,cols:14,amp:.04,wl:10,mode:'flow'})];
  layers.forEach(L=>L.off=new Float32Array(L.cols));
}
defaults();

function sample(){
  const c=document.createElement('canvas');c.width=1200;c.height=1500;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,1500);gr.addColorStop(0,'#1f2a44');gr.addColorStop(.55,'#c8735a');gr.addColorStop(1,'#efd9b4');
  g.fillStyle=gr;g.fillRect(0,0,1200,1500);
  g.fillStyle='#f4e4c4';g.beginPath();g.arc(600,640,190,0,7);g.fill();
  g.fillStyle='#141a26';
  for(let i=0;i<3;i++){g.beginPath();g.moveTo(0,1500);for(let x=0;x<=1200;x+=20)g.lineTo(x,1000+i*140+Math.sin(x/(130+i*40)+i)*60);g.lineTo(1200,1500);g.closePath();g.globalAlpha=.55+i*.2;g.fill()}
  g.globalAlpha=1;g.fillStyle='rgba(255,255,255,.85)';g.font='600 34px Heebo, sans-serif';g.textAlign='center';g.fillText('Sample · use "Image" at the top to replace',600,140);
  const im=new Image();im.onload=()=>{img=im;fit();draw()};im.src=c.toDataURL();
}

function fit(){
  if(!img)return;
  const W=innerWidth,H=innerHeight,pad=56,dpr=Math.min(devicePixelRatio||1,2);
  const s=Math.min((W-pad)/img.width,(H-pad)/img.height,2);
  const w=Math.max(50,Math.round(img.width*s)),h=Math.max(50,Math.round(img.height*s));
  view.style.width=w+'px';view.style.height=h+'px';
  view.width=Math.round(w*dpr);view.height=Math.round(h*dpr);
}

function anim(L,i){
  if((!G.play&&t===0)||L.mode==='none')return 0;
  const n=L.cols,k=i/L.wl*Math.PI*2,a=L.amp,sp=G.speed;
  switch(L.mode){
    case 'wave': return a*Math.sin(k-t*sp*2);
    case 'flow': return a*(.6*Math.sin(k*.7-t*sp*1.3)+.4*Math.sin(k*1.9+t*sp*.8+1.3)*Math.cos(t*sp*.35+i*.11));
    case 'ripple':{const d=Math.abs(i-(n-1)/2);return a*Math.sin(d/L.wl*Math.PI*2-t*sp*2.4)*Math.exp(-d/(n*.7))}
    case 'drift': return t*sp*.08*(1+.5*Math.sin(k)) + a*Math.sin(k-t*sp);
  }
  return 0;
}
function impulse(li,i){
  if(!impulses.length)return 0;
  const now=performance.now()/1000;let s=0;
  for(const p of impulses){
    if(p.layer!==li)continue;
    const age=now-p.t0, x=Math.abs(i-p.ci)-p.v*age;
    s+=p.a*Math.exp(-(x*x)/(2*p.sig*p.sig))*Math.cos(2*Math.PI*x/p.wl)*Math.exp(-age/2.5)*Math.min(1,age*6);
  }
  return s;
}
const shift=(L,i)=>L.off[i]+anim(L,i)+impulse(layers.indexOf(L),i);

function geom(L,W,H){
  const th=L.angle*Math.PI/180, c=Math.cos(th), s=Math.sin(th);
  const ext=Math.abs(c)*W/2+Math.abs(s)*H/2;
  return {px:c,py:-s,dx:s,dy:c,umin:-ext,su:2*ext/L.cols};
}
function chordAt(u,g,W,H){
  let lo=-Infinity,hi=Infinity;
  for(const [a,b,h] of [[u*g.px,g.dx,W/2],[u*g.py,g.dy,H/2]]){
    if(Math.abs(b)<1e-9){if(Math.abs(a)>h)return 0;continue}
    const t1=(-h-a)/b,t2=(h-a)/b;lo=Math.max(lo,Math.min(t1,t2));hi=Math.min(hi,Math.max(t1,t2));
  }
  return Math.max(0,hi-lo);
}
function ringGeom(L,W,H){
  const cx=L.cx*W,cy=L.cy*H;
  const rmax=Math.max(Math.hypot(cx,cy),Math.hypot(W-cx,cy),Math.hypot(cx,H-cy),Math.hypot(W-cx,H-cy));
  return {cx,cy,dr:rmax/L.cols};
}
function renderRings(c,src,W,H,L,scale){
  const g=ringGeom(L,W,H), gap=L.gap*scale, ov=gap>0?0:.5*scale;
  for(let i=0;i<L.cols;i++){
    let r0=Math.max(0,i*g.dr+gap/2-ov); const r1=(i+1)*g.dr-gap/2+ov;
    if(r1<=r0)continue;
    const ang=shift(L,i)*Math.PI;
    c.save();
    c.beginPath();c.arc(g.cx,g.cy,r1,0,Math.PI*2);
    if(r0>0){c.moveTo(g.cx+r0,g.cy);c.arc(g.cx,g.cy,r0,0,Math.PI*2,true)}
    c.clip('evenodd');
    c.translate(g.cx,g.cy);c.rotate(ang);c.translate(-g.cx,-g.cy);
    c.drawImage(src,0,0,W,H);
    c.restore();
  }
}
function renderLayer(c,src,W,H,L,scale){
  if(L.type==='rings')return renderRings(c,src,W,H,L,scale);
  const g=geom(L,W,H), gap=L.gap*scale, ov=gap>0?0:.5*scale, BIG=W+H;
  for(let i=0;i<L.cols;i++){
    const u0=g.umin+i*g.su;
    const chord=Math.max(chordAt(u0+g.su/2,g,W,H),chordAt(u0+1e-3,g,W,H),chordAt(u0+g.su-1e-3,g,W,H));
    if(chord<=0)continue;
    const w=g.su-gap+2*ov; if(w<=0)continue;
    const s=shift(L,i)*H;
    c.save();
    c.translate(W/2,H/2);c.transform(g.px,g.py,g.dx,g.dy,0,0);
    c.beginPath();c.rect(u0+gap/2-ov,-BIG,w,2*BIG);c.clip();
    let shifts=[s];
    if(G.wrap){const m=((s%chord)+chord)%chord;shifts=[m,m-chord]}
    for(const sh of shifts){
      c.save();c.translate(0,sh);c.transform(g.px,g.dx,g.py,g.dy,0,0);
      c.drawImage(src,-W/2,-H/2,W,H);c.restore();
    }
    c.restore();
  }
}
const bufs={};
function buf(key,W,H){
  let b=bufs[key];if(!b){b=bufs[key]=document.createElement('canvas')}
  if(b.width!==W||b.height!==H){b.width=W;b.height=H}
  const bc=b.getContext('2d');bc.setTransform(1,0,0,1,0,0);bc.clearRect(0,0,W,H);bc.imageSmoothingQuality='high';
  return [b,bc];
}
function render(c,W,H,scale,key){
  c.setTransform(1,0,0,1,0,0);c.fillStyle=G.bg;c.fillRect(0,0,W,H);
  const active=layers.filter(L=>L.on);
  if(!active.length){c.drawImage(img,0,0,W,H);return}
  let src=img;
  active.forEach((L,k)=>{
    if(k===active.length-1)renderLayer(c,src,W,H,L,scale);
    else{const [b,bc]=buf(key+k,W,H);renderLayer(bc,src,W,H,L,scale);src=b}
  });
}
function draw(){ if(img){ctx.imageSmoothingQuality='high';render(ctx,view.width,view.height,view.width/parseFloat(view.style.width),'v')} }

function kick(){ if(!raf)raf=requestAnimationFrame(tick) }
function tick(ts){
  raf=0;
  if(G.play){ if(last)t+=(ts-last)/1000; last=ts } else last=0;
  const now=performance.now()/1000;
  for(let k=impulses.length-1;k>=0;k--) if(now-impulses[k].t0>7) impulses.splice(k,1);
  draw();
  if(G.play||impulses.length)kick();
}

// ---- drawers
document.querySelectorAll('.handle').forEach(h=>h.addEventListener('click',()=>{
  const d=$(h.dataset.d), open=!d.classList.contains('open');
  document.querySelectorAll('.drawer').forEach(x=>x.classList.remove('open'));
  if(open)d.classList.add('open');
}));

// ---- controls
const L=()=>layers[cur];
const fmt={cx:v=>Math.round(v*100)+'%',cy:v=>Math.round(v*100)+'%',angle:v=>v+'°',cols:v=>v,gap:v=>v,amp:v=>Math.round(v*100)+'%',wl:v=>v,radius:v=>v,sens:v=>v.toFixed(2),speed:v=>v.toFixed(2)};
const layerKeys=['angle','cols','gap','amp','wl','cx','cy'];
const showVal=(id,v)=>$(id+'V').textContent=fmt[id](v);
function resample(Ly,n){
  const o=Ly.off,nn=new Float32Array(n);
  for(let i=0;i<n;i++){const p=o.length>1?i*(o.length-1)/Math.max(1,n-1):0,a=Math.floor(p),b=Math.min(o.length-1,a+1);nn[i]=(o[a]+(o[b]-o[a])*(p-a))||0}
  Ly.off=nn;Ly.cols=n;
}
layerKeys.forEach(k=>$(k).addEventListener('input',e=>{
  const v=parseFloat(e.target.value);
  if(k==='cols')resample(L(),v);else L()[k]=v;
  showVal(k,v);draw();
}));
['radius','sens','speed'].forEach(k=>$(k).addEventListener('input',e=>{G[k]=parseFloat(e.target.value);showVal(k,G[k]);draw()}));

function syncUI(){
  const Ly=L(), rings=Ly.type==='rings';
  layerKeys.forEach(k=>{$(k).value=Ly[k];showVal(k,Ly[k])});
  $('mode').value=Ly.mode;
  $('on').checked=Ly.on;
  $('onWrap').hidden=cur===0;
  [0,1].forEach(i=>{$('tab'+i).setAttribute('aria-pressed',i===cur);$('tab'+i).classList.toggle('live',layers[i].on)});
  $('gStrips').hidden=rings;$('gRings').hidden=!rings;
  $('typeStrips').setAttribute('aria-pressed',!rings);$('typeRings').setAttribute('aria-pressed',rings);
  $('pickCenter').setAttribute('aria-pressed',picking);view.classList.toggle('picking',picking);
  ['radius','sens','speed'].forEach(k=>{$(k).value=G[k];showVal(k,G[k])});
  $('wrap').checked=G.wrap;
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===G.bg));$('bgc').value=G.bg;
  $('play').setAttribute('aria-pressed',G.play);$('play').textContent=G.play?'Pause':'Play';
}
[0,1].forEach(i=>$('tab'+i).addEventListener('click',()=>{
  cur=i; if(i===1&&!layers[1].touched){layers[1].on=true;layers[1].touched=true}
  picking=false;syncUI();draw();
}));
function setType(tp){
  const Ly=L(); if(Ly.type===tp)return;
  Ly.type=tp; Ly.off.fill(0);
  if(tp==='rings'&&Ly.cols>40)resample(Ly,16);
  picking=false; syncUI(); draw();
}
$('typeStrips').addEventListener('click',()=>setType('strips'));
$('typeRings').addEventListener('click',()=>setType('rings'));
$('pickCenter').addEventListener('click',()=>{picking=!picking;syncUI()});
$('on').addEventListener('change',e=>{L().on=e.target.checked;L().touched=true;syncUI();draw()});
document.querySelectorAll('.angles button').forEach(b=>b.addEventListener('click',()=>{L().angle=+b.dataset.a;syncUI();draw()}));
$('mode').addEventListener('change',e=>{L().mode=e.target.value;draw()});
$('wrap').addEventListener('change',e=>{G.wrap=e.target.checked;draw()});
$('play').addEventListener('click',()=>{G.play=!G.play;syncUI();kick()});
function setBg(c){G.bg=c;syncUI();draw()}
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>setBg(b.dataset.c)));
$('bgc').addEventListener('input',e=>setBg(e.target.value));

$('straight').addEventListener('click',()=>{L().off.fill(0);draw()});
$('resetAll').addEventListener('click',()=>{
  Object.assign(G,GDEF);t=0;impulses.length=0;
  defaults();cur=0;picking=false;syncUI();draw();
});
$('random').addEventListener('click',()=>{
  const Ly=L(),n=Ly.cols,ph=Math.random()*6.28,ph2=Math.random()*6.28;
  for(let i=0;i<n;i++)Ly.off[i]+=.06*Math.sin(i/n*6.28*(1+Math.random()*.3)+ph)+.03*Math.sin(i/n*6.28*3.1+ph2)+(Math.random()-.5)*.02;
  draw();
});
$('smooth').addEventListener('click',()=>{
  const Ly=L(),n=Ly.cols,c=Float32Array.from(Ly.off);
  for(let i=0;i<n;i++){const a=c[Math.max(0,i-1)],b=c[Math.min(n-1,i+1)];Ly.off[i]=.25*a+.5*c[i]+.25*b}
  draw();
});
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{img=im;layers.forEach(Ly=>Ly.off.fill(0));t=0;impulses.length=0;fit();draw()};im.src=url;
  e.target.value='';
});

// ---- pointer: drag, long-press wave
function toCanvas(e){const r=view.getBoundingClientRect();return [(e.clientX-r.left)*view.width/r.width,(e.clientY-r.top)*view.height/r.height]}
function indexAt(Ly,x,y){
  const W=view.width,H=view.height;
  if(Ly.type==='rings'){const g=ringGeom(Ly,W,H);return Math.hypot(x-g.cx,y-g.cy)/g.dr-.5}
  const g=geom(Ly,W,H);return (g.px*(x-W/2)+g.py*(y-H/2)-g.umin)/g.su-.5;
}
function emit(p){
  const Ly=L(); if(!Ly.on){Ly.on=true;Ly.touched=true;syncUI()}
  impulses.push({layer:cur,ci:indexAt(Ly,p[0],p[1]),t0:performance.now()/1000,
    a:Math.max(Ly.amp,.05)*1.3,v:4+10*G.speed,sig:Math.max(2,Ly.wl*.5),wl:Math.max(3,Ly.wl*.6)});
  try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}
  kick();
}
let drag=null;
const dpr=()=>view.width/parseFloat(view.style.width||1);
view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('pointerdown',e=>{
  $('hint').style.opacity=0;
  const p=toCanvas(e);
  if(picking){L().cx=Math.min(1,Math.max(0,p[0]/view.width));L().cy=Math.min(1,Math.max(0,p[1]/view.height));picking=false;syncUI();draw();return}
  view.setPointerCapture(e.pointerId);
  drag={p,start:p,moved:false,lp:false,rep:0};
  drag.timer=setTimeout(()=>{
    if(!drag||drag.moved)return;
    drag.lp=true;emit(drag.p);
    drag.rep=setInterval(()=>drag&&emit(drag.p),650);
  },450);
});
view.addEventListener('pointermove',e=>{
  if(!drag)return;
  const [x,y]=toCanvas(e);
  if(drag.lp){drag.p=[x,y];return}
  if(!drag.moved){
    if(Math.hypot(x-drag.start[0],y-drag.start[1])<8*dpr())return;
    drag.moved=true;clearTimeout(drag.timer);
    const Ly=L();if(!Ly.on){Ly.on=true;Ly.touched=true;syncUI()}
  }
  const Ly=L(),W=view.width,H=view.height,[x0,y0]=drag.p;drag.p=[x,y];
  let dv;
  if(Ly.type==='rings'){
    const g=ringGeom(Ly,W,H),ax=x0-g.cx,ay=y0-g.cy,bx=x-g.cx,by=y-g.cy;
    dv=Math.atan2(ax*by-ay*bx,ax*bx+ay*by)/Math.PI*G.sens*2;
  }else{
    const g=geom(Ly,W,H);dv=(g.dx*(x-x0)+g.dy*(y-y0))/H*G.sens*2;
  }
  const ci=indexAt(Ly,x,y),R=G.radius;
  for(let i=0;i<Ly.cols;i++){
    const d=Math.abs(i-ci);
    const w=R<=0?(Math.round(ci)===i?1:0):Math.exp(-(d*d)/(2*(R/2)*(R/2)));
    if(w>.002)Ly.off[i]+=dv*w;
  }
  kick();
});
function end(){ if(drag){clearTimeout(drag.timer);clearInterval(drag.rep)} drag=null }
view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);

// ---- export
$('export').addEventListener('click',()=>{
  if(!img)return;
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const g=c.getContext('2d');g.imageSmoothingQuality='high';
  render(g,img.width,img.height,img.width/(parseFloat(view.style.width)||img.width),'x');
  c.toBlob(b=>{$('ovImg').src=URL.createObjectURL(b);$('ov').hidden=false},'image/png');
});
$('ovClose').addEventListener('click',()=>$('ov').hidden=true);

addEventListener('resize',()=>{fit();draw()});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){GDEF.speed=.3;G.speed=.3}
setTimeout(()=>$('hint').style.opacity=0,6000);
syncUI();
sample();
</script>

</body></html>
